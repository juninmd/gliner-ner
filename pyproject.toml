[project]
name = "gliner-ner"
version = "0.1.0"
description = "Shared zero-shot NER extraction service (GLiNER) for reuse across apps in the cluster"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gliner>=0.2.13",
    "pydantic>=2.8",
    "transformers>=4.40,<6",
    "protobuf>=4.25",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gliner_ner"]
